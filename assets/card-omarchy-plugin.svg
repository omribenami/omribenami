<svg xmlns="http://www.w3.org/2000/svg" width="420" height="212" viewBox="0 0 420 212" role="img" aria-label="omarchy-ai-plugin"><defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b48cff" stop-opacity=".9"/><stop offset=".45" stop-color="#1c2234"/><stop offset="1" stop-color="#5ef1ff" stop-opacity=".6"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1019"/><stop offset="1" stop-color="#090a10"/></linearGradient>
<radialGradient id="gl" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#b48cff" stop-opacity=".12"/><stop offset="1" stop-color="#b48cff" stop-opacity="0"/></radialGradient>
<pattern id="sc" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" opacity=".28"/></pattern>
<pattern id="dt" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#232a3f"/></pattern>
<style>.m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace} .bl{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
.sh{animation:s 5s ease-in-out infinite} @keyframes s{0%,100%{opacity:.25}50%{opacity:.8}}</style></defs><rect x="1" y="1" width="418" height="210" rx="12" fill="url(#bg)" stroke="url(#bd)" stroke-width="1.5"/><rect x="1" y="1" width="418" height="210" rx="12" fill="url(#dt)" opacity=".6"/><rect x="1" y="1" width="418" height="210" rx="12" fill="url(#gl)"/><text class="m" x="22" y="34" font-size="12" fill="#5c6680"><tspan fill="#b48cff">❯</tspan> cd ~/omarchy-ai-plugin<tspan class="bl" fill="#b48cff"> ▍</tspan></text><text class="m" x="22" y="70" font-size="22" font-weight="700" fill="#e8ecf8">omarchy-ai-plugin</text><rect class="sh" x="22" y="80" width="48" height="2" fill="#b48cff"/><text class="m" x="22" y="106" font-size="12.5" fill="#9aa4c0">QML widget that puts Omarchy-AI settings and</text><text class="m" x="22" y="125" font-size="12.5" fill="#9aa4c0">status into the Omarchy/Hyprland shell bar —</text><text class="m" x="22" y="144" font-size="12.5" fill="#9aa4c0">the agent as a native part of the desktop.</text><circle cx="28" cy="186" r="5" fill="#44a51c"/><text class="m" x="40" y="190" font-size="12" fill="#c6cde0">QML</text><text class="m" x="80.2" y="190" font-size="11.5" fill="#5c6680">#hyprland</text><text class="m" x="158.2" y="190" font-size="11.5" fill="#5c6680">#desktop</text><rect width="420" height="212" rx="12" fill="url(#sc)"/></svg>