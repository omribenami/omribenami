<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="Focus areas"><defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ef1ff" stop-opacity=".9"/><stop offset=".45" stop-color="#1c2234"/><stop offset="1" stop-color="#b48cff" stop-opacity=".6"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1019"/><stop offset="1" stop-color="#090a10"/></linearGradient>
<radialGradient id="gl" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#5ef1ff" stop-opacity=".12"/><stop offset="1" stop-color="#5ef1ff" stop-opacity="0"/></radialGradient>
<pattern id="sc" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" opacity=".28"/></pattern>
<pattern id="dt" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#232a3f"/></pattern>
<style>.m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace} .bl{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
.sh{animation:s 5s ease-in-out infinite} @keyframes s{0%,100%{opacity:.25}50%{opacity:.8}}</style></defs><g transform="translate(0,0)"><rect x="1" y="1" width="268" height="198" rx="12" fill="url(#bg)" stroke="#5ef1ff" stroke-opacity=".35"/><rect x="1" y="1" width="268" height="198" rx="12" fill="url(#dt)" opacity=".5"/><g transform="translate(24,22)" fill="none" stroke="#5ef1ff" stroke-width="1.6"><circle cx="16" cy="16" r="14" stroke-opacity=".35"/><circle cx="16" cy="16" r="8" stroke-opacity=".6"/><circle cx="16" cy="16" r="2.5" fill="#5ef1ff"/><path class="sh" d="M16 16 L30 8" /></g><text class="m" x="68" y="38" font-size="13" font-weight="700" fill="#e8ecf8">AUTONOMOUS MOBILITY</text><text class="m" x="68" y="55" font-size="12" fill="#5ef1ff">&amp; OPERATIONS</text><text class="m" x="24" y="96" font-size="12" fill="#9aa4c0">Leading US technical ops for</text><text class="m" x="24" y="116" font-size="12" fill="#9aa4c0">an autonomous driving program.</text><text class="m" x="24" y="136" font-size="12" fill="#9aa4c0">Integration, deployment, and</text><text class="m" x="24" y="156" font-size="12" fill="#9aa4c0">teams across countries.</text></g><g transform="translate(285,0)"><rect x="1" y="1" width="268" height="198" rx="12" fill="url(#bg)" stroke="#b48cff" stroke-opacity=".35"/><rect x="1" y="1" width="268" height="198" rx="12" fill="url(#dt)" opacity=".5"/><g transform="translate(24,22)" fill="none" stroke="#b48cff" stroke-width="1.6"><rect x="1" y="3" width="30" height="24" rx="4" stroke-opacity=".6"/><path d="M7 11 L12 15 L7 19"/><rect class="bl" x="15" y="18" width="8" height="2" fill="#b48cff" stroke="none"/></g><text class="m" x="68" y="38" font-size="13" font-weight="700" fill="#e8ecf8">AI AGENTS</text><text class="m" x="68" y="55" font-size="12" fill="#b48cff">&amp; INTELLIGENT SYSTEMS</text><text class="m" x="24" y="96" font-size="12" fill="#9aa4c0">Agents that run real tasks on</text><text class="m" x="24" y="116" font-size="12" fill="#9aa4c0">a Linux desktop: voice, tools,</text><text class="m" x="24" y="136" font-size="12" fill="#9aa4c0">computer control, local LLMs</text><text class="m" x="24" y="156" font-size="12" fill="#9aa4c0">— with approvals in the loop.</text></g><g transform="translate(570,0)"><rect x="1" y="1" width="268" height="198" rx="12" fill="url(#bg)" stroke="#5ef1ff" stroke-opacity=".35"/><rect x="1" y="1" width="268" height="198" rx="12" fill="url(#dt)" opacity=".5"/><g transform="translate(24,22)" fill="none" stroke="#5ef1ff" stroke-width="1.6"><path d="M3 16 L16 5 L29 16" stroke-opacity=".7"/><path d="M7 14 V28 H25 V14" stroke-opacity=".45"/><circle class="sh" cx="16" cy="20" r="3" fill="#5ef1ff"/></g><text class="m" x="68" y="38" font-size="13" font-weight="700" fill="#e8ecf8">EXPERIMENTAL</text><text class="m" x="68" y="55" font-size="12" fill="#5ef1ff">ENGINEERING &amp; AUTOMATION</text><text class="m" x="24" y="96" font-size="12" fill="#9aa4c0">Drones, ESP32 voice hardware,</text><text class="m" x="24" y="116" font-size="12" fill="#9aa4c0">Home Assistant, Hebrew wake</text><text class="m" x="24" y="136" font-size="12" fill="#9aa4c0">words. Software, hardware and</text><text class="m" x="24" y="156" font-size="12" fill="#9aa4c0">automation, wired together.</text></g><rect width="840" height="200" fill="url(#sc)" opacity=".7"/></svg>